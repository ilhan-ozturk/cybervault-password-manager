name: Dependency Security

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pip-audit
      - run: pip-audit -r requirements.txt
